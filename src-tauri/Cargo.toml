[package]
name = "pdf-splitter"
version = "0.1.0"
description = "按章节把 PDF 拆成多个文件"
authors = []
edition = "2024"

[lib]
name = "pdf_splitter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9.6"
sha2 = "0.11"
dirs = "7"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
